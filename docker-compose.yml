version: "3.9"

# ─── PermuPay Vendas — Docker Compose (desenvolvimento local) ─────────────────
# Uso: docker compose up -d
# Requer: arquivo .env preenchido a partir do .env.example

services:
  # ── Aplicação ────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: permupay-vendas-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://permupay:${POSTGRES_PASSWORD:-permupay123}@postgres:5432/permupay_vendas
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - permupay-network

  # ── PostgreSQL 14 ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:14-alpine
    container_name: permupay-vendas-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: permupay_vendas
      POSTGRES_USER: permupay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-permupay123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./drizzle/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permupay -d permupay_vendas"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - permupay-network

volumes:
  postgres_data:
    driver: local

networks:
  permupay-network:
    driver: bridge
